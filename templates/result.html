<!DOCTYPE html>
<html>
<head>
    <title>Result</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        h1 {
            color: white;
            text-align: center;
            margin-top: 40px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.3);
        }

        p {
            font-size: 18px;
            margin: 12px 0;
            color: #333;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .button:hover {
            background: #5a67d8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1><i class="fa-solid fa-chart-line"></i> Analysis Result</h1>

    <div class="card">

        <p><i class="fa-solid fa-chart-bar"></i> 
        <strong>Score:</strong> {{ score }}</p>

        <p><i class="fa-solid fa-triangle-exclamation"></i> 
        <strong>Weak Areas:</strong> {{ weaknesses }}</p>

        <p><i class="fa-solid fa-lightbulb"></i> 
        <strong>Recommendations:</strong> {{ recommendations }}</p>

        <p><i class="fa-solid fa-briefcase"></i> 
        <strong>Placement Prediction:</strong> {{ placement }}</p>

        <p><i class="fa-solid fa-robot"></i> 
        <strong>AI Feedback:</strong> {{ feedback }}</p>

    </div>

    <a href="/" class="button">
        <i class="fa-solid fa-arrow-left"></i> Go Back
    </a>

</div>

</body>
</html>
