<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2><i class="fa-solid fa-user-lock"></i> Admin Login</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="👤 Username" required>

        <input type="password" name="password" placeholder="🔒 Password" required>

        <button type="submit">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

</div>

</body>
</html>
