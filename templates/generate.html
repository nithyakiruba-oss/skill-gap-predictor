<!DOCTYPE html>
<html>
<head>
    <title>Data Generated</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        h1 {
            color: white;
            text-align: center;
            margin-top: 40px;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 80px auto;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.3);
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .button:hover {
            background: #5a67d8;
        }
    </style>
</head>

<body>

<h1><i class="fa-solid fa-database"></i> Dataset Ready</h1>

<div class="container">

    <div class="card">

        <h2><i class="fa-solid fa-circle-check"></i> Data Generated Successfully!</h2>

        <p>100 student records have been added to the database.</p>

        <a href="/admin" class="button">
            <i class="fa-solid fa-table"></i> View Dashboard
        </a>

    </div>

</div>

</body>
</html>
